name: Build and Release GoPhish

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: gophish/gophish   # 或你自己的 fork
          ref: master

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Linux binary
        run: |
          GOOS=linux GOARCH=amd64 go build -o gophish

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: gophish-binary
          path: gophish

      - name: Create Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: gophish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # 默认就有
